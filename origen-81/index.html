:"02 / Fiambres",title:"FABRICACIÓN DE FIAMBRES",subtitle:"CURADO ARTESANAL",paragraphs:["Todo comienza con una excelente pieza de carne, ingredientes cuidadosamente seleccionados y el tiempo necesario para hacer las cosas bien. Porque la calidad no se apura: se construye con paciencia, dedicación y pasión.","Elegimos una bondiola de primera calidad, la preparamos y condimentamos artesanalmente para realzar su sabor natural. Luego inicia el proceso de curado, donde la sal y las especias penetran lentamente en la carne, desarrollando aromas intensos, una textura delicada y un sabor profundo e irresistible.","Después, la dejamos madurar en condiciones controladas, respetando cada etapa para que los sabores se integren y alcance su punto justo. El resultado es una bondiola tierna, sabrosa y equilibrada, con todo el carácter de una elaboración artesanal.","Finalmente, la cortamos y envasamos cuidadosamente para conservar su frescura, aroma y calidad hasta el momento de disfrutarla.","Una bondiola premium, elaborada artesanalmente con dedicación, tiempo y pasión."],accent:"Donde todo comienza."},{icon:"\uD83E\uDED9",label:"03 / Conservas",title:"ELABORACIÓN DE CONSERVAS",subtitle:"FRASCOS CON HISTORIA",paragraphs:["Todo comienza con ingredientes frescos, seleccionados cuidadosamente y el tiempo necesario para hacer las cosas bien. Porque la calidad no se apura: se construye con paciencia, dedicación y pasión.","Elegimos frutas y vegetales de primera calidad, los preparamos y combinamos artesanalmente para realzar sus sabores naturales. Luego inicia el proceso de elaboración, donde cada ingrediente se cocina lentamente con especias y condimentos cuidadosamente seleccionados, desarrollando aromas intensos, texturas delicadas y un sabor profundo e irresistible.","Después, envasamos cada conserva respetando rigurosos procesos de higiene y seguridad, para preservar sus propiedades, frescura y calidad. El resultado es una conserva sabrosa, equilibrada y llena de carácter, elab
