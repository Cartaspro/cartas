<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin V4 - Sheets por Cliente</title>
<style>
/* Inter cargado vía Google Fonts en prod; fallback system para validación offline sin console errors */
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter', system-ui, -apple-system, Segoe UI, Roboto, sans-serif}
body{background:#0f0f0f;color:#fff}
.top{padding:14px 18px;border-bottom:1px solid #1c1c1c;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#0f0f0f;z-index:20;gap:10px;flex-wrap:wrap}
.main{max-width:1500px;margin:0 auto;display:grid;grid-template-columns:330px 1fr;min-height:100vh}
@media(max-width:1100px){.main{grid-template-columns:1fr}}
.left{border-right:1px solid #1c1c1c;padding:14px;display:flex;flex-direction:column;gap:12px} .right{padding:14px;display:flex;flex-direction:column;gap:14px}
.card{background:#1c1c1c;border:1px solid #262626;border-radius:18px;padding:16px}
input,textarea,select{background:#0f0f0f;border:1px solid #333;border-radius:10px;padding:12px;color:#fff;width:100%;font-size:14px}
input:focus,textarea:focus,select:focus{outline:none;border-color:#FFD60A}
.btn{padding:10px 16px;border-radius:100px;border:0;font-weight:800;cursor:pointer;font-size:12px;transition:.15s}
.btn:hover{transform:translateY(-1px);opacity:.95}
.btn-w{background:#fff;color:#000} .btn-r{background:#E11D48;color:#fff} .btn-g{background:#262626;color:#fff} .btn-y{background:#FFD60A;color:#000} .btn-del{background:#ff0033;color:#fff} .btn-green{background:#00ff88;color:#000}
.client{padding:11px 12px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;background:#0f0f0f;border:1px solid #1c1c1c;font-size:13px;cursor:pointer}
.client.active{border-color:#fff;background:#fff;color:#000}
.client:hover{border-color:#444}
.status{font-size:10px;padding:4px 8px;border-radius:100px;font-weight:800} .ok{background:#00ff88;color:#000} .baja{background:#ff0033;color:#fff}
.preview{width:100%;height:460px;border-radius:16px;border:1px solid #262626;background:#000}
.kv{margin-bottom:12px} .kv label{display:block;font-size:11px;color:#FFD60A;font-weight:800;margin-bottom:6px;text-transform:uppercase}
.prod-card{background:#101010;border:1px solid #262626;border-radius:16px;padding:14px;display:grid;grid-template-columns:90px 1fr;gap:14px;margin-bottom:14px;position:relative}
.prod-card.locked{border-color:#FFD60A}
.prod-card img{width:90px;height:90px;border-radius:12px;object-fit:cover;background:#1c1c1c}
.field{display:flex;flex-direction:column;margin-bottom:8px} .field label{font-size:10px;color:#888;font-weight:700;margin-bottom:4px;text-transform:uppercase}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:600px){.row2{grid-template-columns:1fr} .prod-card{grid-template-columns:90px 1fr}}
.small{font-size:11px;color:#777;margin-top:6px;line-height:1.4}
.uploadBox{border:1px dashed #444;border-radius:10px;padding:8px;text-align:center;cursor:pointer;background:#0f0f0f;font-size:11px;color:#888}
.uploadBox:hover{border-color:#FFD60A;color:#FFD60A}
.badge{font-size:10px;background:#0f0f0f;border:1px solid #262626;padding:5px 9px;border-radius:100px;color:#888}
.lock-badge{position:absolute;top:8px;right:8px;background:#FFD60A;color:#000;font-size:9px;padding:4px 8px;border-radius:100px;font-weight:900}
.exportZone{background:#101010;border:2px dashed #FFD60A;border-radius:18px;padding:18px}

<script>
const DEMO_CONFIG = ${Cm};
const DEMO_DATA = ${_m};

let TOKEN = localStorage.getItem('gh_token') || '';
let REPO = localStorage.getItem('gh_repo') || 'Cartaspro/cartas';
let CUR_SLUG = localStorage.getItem('cur_slug') || 'origen-81';
let curConfig = JSON.parse(JSON.stringify(DEMO_CONFIG));
let curData = JSON.parse(JSON.stringify(DEMO_DATA));
let sheetPreviewData = [
  {id:1,nombre:'Cerveza ORIGEN 81 - Rubia',precio:2800,activo:true,nota:''},
  {id:2,nombre:'Cerveza ORIGEN 81 - IPA',precio:3200,activo:true,nota:''},
  {id:3,nombre:'Bondiola Premium Curada',precio:8500,activo:true,nota:''},
  {id:5,nombre:'Conserva de Berenjenas',precio:4500,activo:true,nota:''}
];

document.getElementById('token').value = TOKEN;
document.getElementById('repo').value = REPO;
document.getElementById('repoLabel').textContent = REPO;

function saveTok(){
  TOKEN = document.getElementById('token').value.trim();
  REPO = document.getElementById('repo').value.trim() || 'Cartaspro/cartas';
  localStorage.setItem('gh_token', TOKEN);
  localStorage.setItem('gh_repo', REPO);
  document.getElementById('repoLabel').textContent = REPO;
  alert('Token y repo guardados');
  listar();
}

async function gh(path, method='GET', body=null){
  if(!TOKEN) throw new Error('Falta token');
  const url = 'https://api.github.com/repos/'+REPO+'/contents/'+path;
  let headers = {Authorization:'Bearer '+TOKEN, Accept:'application/vnd.github.v3+json'};
  let opts = {method, headers};
  if(method==='GET'){
    const r = await fetch(url, opts);
    if(!r.ok) throw new Error('GH GET '+r.status+' '+path);
    return await r.json();
  } else {
    // need sha first
    let sha = null;
    try{
      const existing = await fetch(url, {headers});
      if(existing.ok){ const j=await existing.json(); sha=j.sha; }
    }catch(e){}
    const content = btoa(unescape(encodeURIComponent(typeof body==='string'?body:JSON.stringify(body,null,2))));
    const payload = {message:'admin v4 update '+path, content, sha: sha||undefined};
    if(!sha) delete payload.sha;
    const r = await fetch(url, {method:'PUT', headers, body: JSON.stringify(payload)});
    if(!r.ok){ const t=await r.text(); throw new Error('GH PUT '+r.status+' '+t); }
    return await r.json();
  }
}

async function listar(){
  const listEl = document.getElementById('list');
  listEl.innerHTML='Cargando...';
  try{
    if(!TOKEN){
      throw new Error('sin token demo');
    }
    // intenta listar /cartas o root
    let data;
    try{
      data = await gh('cartas');
    }catch{
      data = await gh('');
    }
    const arr = Array.isArray(data)?data:[data];
    const dirs = arr.filter(x=>x.type==='dir').map(x=>x.name);
    // si no hay dirs, intenta parsear como files de cartaspro.github.io? fallback
    const slugs = dirs.length?dirs:['origen-81'];
    listEl.innerHTML='';
    slugs.forEach(slug=>{
      const div = document.createElement('div');
      div.className='client'+(slug===CUR_SLUG?' active':'');
      div.innerHTML='<span>'+slug+'</span><span class="status ok">ok</span>';
      div.onclick=()=>cargar(slug);
      listEl.appendChild(div);
    });
    if(!slugs.includes(CUR_SLUG) && slugs.length){ cargar(slugs[0]); }
  }catch(e){
    // modo demo
    listEl.innerHTML='';
    const demoSlugs=['origen-81','queseria-demo','bodegon-demo'];
    demoSlugs.forEach(slug=>{
      const div=document.createElement('div');
      div.className='client'+(slug===CUR_SLUG?' active':'');
      const st = slug==='origen-81'?'ok':'baja';
      const label = slug==='origen-81'?'ok':'demo';
      div.innerHTML='<span>'+slug+'</span><span class="status '+st+'">'+label+'</span>';
      div.onclick=()=>cargar(slug);
      listEl.appendChild(div);
    });
    document.getElementById('estadoGeneral').textContent='Modo demo sin token. Mostrando origen-81 + demos. Agrega token para GitHub real.';
  }
  if(CUR_SLUG) cargar(CUR_SLUG);
}

async function cargar(slug){
  CUR_SLUG = slug;
  localStorage.setItem('cur_slug', slug);
  document.getElementById('title').textContent = slug;
  document.querySelectorAll('.client').forEach(c=>{c.classList.toggle('active', c.textContent.includes(slug))});
  const prev = document.getElementById('prev');
  prev.src='https://cartaspro.github.io/cartas/'+slug+'/';
  document.getElementById('estadoZone').innerHTML='<span class="badge">Cargando config...</span>';
  try{
    if(!TOKEN){
      throw new Error('demo');
    }
    const cfgFile = await gh('cartas/'+slug+'/config.json');
    const cfgTxt = atob(cfgFile.content.replace(/\\n/g,''));
    curConfig = JSON.parse(cfgTxt);
    const dataFile = await gh('cartas/'+slug+'/data.json');
    const dataTxt = atob(dataFile.content.replace(/\\n/g,''));
    curData = JSON.parse(dataTxt);
    document.getElementById('estadoZone').innerHTML='<span class="badge" style="color:#00ff88;border-color:#00ff88">Config y data cargados de GitHub</span> <span class="badge">activo: '+(curConfig.activo?'SI':'NO')+'</span>';
  }catch(e){
    if(slug==='origen-81'){
      curConfig = JSON.parse(JSON.stringify(DEMO_CONFIG));
      curData = JSON.parse(JSON.stringify(DEMO_DATA));
    } else {
      curConfig = {...DEMO_CONFIG, nombre: slug.toUpperCase(), googleSheetUrl:'', activo:true, estado:'activo'};
      curData = JSON.parse(JSON.stringify(DEMO_DATA));
    }
    document.getElementById('estadoZone').innerHTML='<span class="badge">Demo local</span> <span class="badge">'+e.message+'</span>';
  }
  // sync sheetPreviewData with curData
  sheetPreviewData = curData.map(p=>({id:p.id,nombre:p.nombre,precio:p.precio,activo:p.activo!==false,nota:p.nota||''}));
  if(curData.length===0) sheetPreviewData = [
    {id:1,nombre:'Cerveza ORIGEN 81 - Rubia',precio:2800,activo:true,nota:''},
    {id:2,nombre:'Cerveza ORIGEN 81 - IPA',precio:3200,activo:true,nota:''},
    {id:3,nombre:'Bondiola Premium Curada',precio:8500,activo:true,nota:''},
    {id:5,nombre:'Conserva de Berenjenas',precio:4500,activo:true,nota:''}
  ];
  document.getElementById('sheetUrlInput').value = curConfig.googleSheetUrl||'';
  renderConfig();
  renderData();
  renderSheetPreview();
  updateSheetsBadge();
}

function setFlat(k,v){
  curConfig[k]=v;
  if(k==='googleSheetUrl'){ updateSheetsBadge(); document.getElementById('sheetUrlInput').value=v; }
}
function setNested(path,v){
  const parts = path.split('.');
  let obj = curConfig;
  for(let i=0;i<parts.length-1;i++){
    if(!obj[parts[i]]) obj[parts[i]]={};
    obj=obj[parts[i]];
  }
  obj[parts[parts.length-1]]=v;
}
function setProd(i,k,v){
  curData[i][k]=v;
  // sync sheet preview
  const sp = sheetPreviewData.find(x=>x.id===curData[i].id);
  if(sp && (k==='precio' || k==='nombre')){ if(k==='precio') sp.precio=v; if(k==='nombre') sp.nombre=v; }
}

function isRealImage(url){
  if(!url) return false;
  if(url.startsWith('data:')) return false;
  return !url.includes('unsplash.com') && (url.includes('github') || url.includes('raw.githubusercontent') || url.includes('img/'));
}
function isRealById(id){return id===3||id===5;}

    <div class="kv"><label>Estado</label><select onchange="setFlat('estado',this.value)"><option value="activo" \${c.estado==='activo'?'selected':''}>activo</option><option value="baja" \${c.estado==='baja'?'selected':''}>baja</option><option value="pausado" \${c.estado==='pausado'?'selected':''}>pausado</option></select></div>

function triggerUpload(i){ document.getElementById('up_'+i).click(); }
async function handleUpload(i,file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (e)=>{
    const base64 = e.target.result.split(',')[1];
    const ext = file.name.split('.').pop();
    const filename = \`\${CUR_SLUG}-\${curData[i].id}-\${Date.now()}.\${ext}\`;
    const path = \`img/\${CUR_SLUG}/\${filename}\`;
    document.getElementById('out').textContent='Subiendo '+filename+'...';
    try{
      if(!TOKEN) throw new Error('Demo sin token: solo preview local');
      await gh(path,'PUT', e.target.result);
      // update url
      const rawUrl = \`https://raw.githubusercontent.com/\${REPO}/main/\${path}\`;
      curData[i].img = rawUrl;
      renderData();
      document.getElementById('out').textContent='Subido: '+rawUrl;
    }catch(err){
      // local preview
      curData[i].img = e.target.result;
      renderData();
      document.getElementById('out').textContent='Modo demo: imagen en base64 local (subí token para GitHub). '+err.message;
    }
  };
  reader.readAsDataURL(file);
}

async function subir(){
  const slug = document.getElementById('slugNew').value.trim().toLowerCase().replace(/\\s+/g,'-');
  const files = document.getElementById('fileIn').files;
  const out = document.getElementById('upOut');
  if(!slug){ out.textContent='Falta slug'; return; }
  if(files.length===0){ out.textContent='Seleccioná 3 archivos (o arrastra)'; return; }
  out.textContent='Subiendo '+files.length+' archivos a cartas/'+slug+'/ ...';
  for(const f of files){
    try{
      const txt = await f.text();
      // si es imagen, leer base64
      if(f.type.startsWith('image/')){
        const b64 = await new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(r.result.split(',')[1]); r.readAsDataURL(f); });
        // upload as binary? usar content base64 ya
        const dataUrl = await new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.readAsDataURL(f); });
        await gh(\`cartas/\${slug}/\${f.name}\`,'PUT', dataUrl);
      } else {
        // try parse json to validar
        try{ JSON.parse(txt); }catch{}
        await gh(\`cartas/\${slug}/\${f.name}\`,'PUT',txt);
      }
      out.textContent+='\\n✅ '+f.name;
    }catch(e){ out.textContent+='\\n❌ '+f.name+': '+e.message; }
  }
  out.textContent+='\\nListo. Ahora cargá '+slug;
}

async function probarConexionSheet(){
  const url=document.getElementById('sheetUrlInput').value.trim() || curConfig.googleSheetUrl;
  const out=document.getElementById('sheetTestOut');
  if(!url){ out.textContent='⚠️ Pega un link CSV primero'; return; }
  out.textContent='Probando conexión...';
  try{
    const res=await fetch(url);
    if(!res.ok) throw new Error('HTTP '+res.status);
    const txt=await res.text();
    const lines=txt.trim().split('\\n').filter(l=>l.trim());
    const count=Math.max(0,lines.length-1);
    // intenta parsear precios
    const rows=lines.slice(1).map(l=>{
      // simple csv split por coma no perfecta pero funcional
      const parts=l.split(',').map(s=>s.replace(/^"|"$/g,'').trim());
      return {id:parseInt(parts[0])||0,nombre:parts[1]||'',precio:parseFloat(parts[2])||0,activo:(parts[3]||'').toLowerCase().includes('true')||parts[3]==='1',nota:parts[4]||''};
    }).filter(r=>r.id);
    if(rows.length){ sheetPreviewData=rows; renderSheetPreview(); }
    out.innerHTML='✅ Conexión OK - '+count+' productos en CSV. '+(rows.length?'Preview actualizado.':'')+' <span style="color:#00ff88">CSV leído.</span>';
  }catch(e){
    out.innerHTML='⚠️ No se pudo fetch directo por CORS, pero link parece válido si es publicado como CSV. Productos esperados: 4 (Rubia 2800, IPA 3200, Bondiola 8500, Berenjenas 4500). Error: '+e.message+'<br><small>Si es Google Sheets, asegúrate de Publicar en la web → CSV y que el link sea público.</small>';
  }
}
