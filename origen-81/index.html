
<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ORIGEN 81 - Carta</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#080808;color:#fff;overflow-x:hidden}
.hero{position:relative;height:56vh;min-height:420px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#000}
.hero img.logo{width:420px;max-width:85vw;height:auto;object-fit:contain;filter:drop-shadow(0 20px 40px rgba(0,0,0,.8));position:relative;z-index:2}
.hero-overlay{position:absolute;inset:0;background:radial-gradient(ellipse at center, transparent 40%, #080808 90%)}
.hero-content{position:absolute;bottom:0;left:0;right:0;padding:28px;max-width:1200px;margin:0 auto;z-index:3}
.hero h1{font-family:'Bebas Neue',sans-serif;font-size:56px;line-height:.9} .hero h1 span{color:#FFD60A} .hero p{font-size:13px;color:#aaa;margin-top:8px;letter-spacing:.04em}
.topinfo{max-width:1200px;margin:-22px auto 0;padding:0 16px;display:grid;grid-template-columns:1.2fr .8fr;gap:14px;position:relative;z-index:5} @media(max-width:860px){.topinfo{grid-template-columns:1fr}}
.card{background:#1c1c1c;border:1px solid #262626;border-radius:22px;padding:20px} .card b{font-size:13px;color:#FFD60A;display:block;margin-bottom:8px;letter-spacing:.06em} .small{font-size:12px;color:#aaa;line-height:1.6}
.intro-wrap{max-width:1200px;margin:18px auto 0;padding:0 16px} .intro-head{margin-bottom:16px} .intro-head h2{font-family:'Bebas Neue';font-size:38px} .intro-head h2 span{color:#FFD60A} .intro-head p{color:#999;font-size:13px;margin-top:4px}
.intro-grid{display:grid;grid-template-columns:1fr;gap:14px} .intro-card{background:#121212;border:1px solid #242424;border-radius:24px;padding:22px;position:relative;overflow:hidden} .intro-card::before{content:'';position:absolute;top:0;left:0;width:100%;height:2px;background:linear-gradient(90deg,#FFD60A,#ff8a00)} .intro-emoji{font-size:32px;margin-bottom:10px;display:block} .intro-title{font-family:'Bebas Neue';font-size:26px} .intro-text{margin-top:12px;color:#bbb;font-size:13px;line-height:1.8;white-space:pre-line} .intro-footer{margin-top:16px;padding-top:14px;border-top:1px solid #222;display:flex;justify-content:space-between} .intro-footer b{color:#FFD60A;font-size:11px;letter-spacing:.12em}
.cats{max-width:1200px;margin:18px auto 0;padding:0 16px;display:flex;gap:8px;overflow:auto} .cat{white-space:nowrap;padding:10px 18px;border-radius:100px;border:1px solid #2a2a2a;background:#141414;color:#888;font-size:12px;font-weight:800;cursor:pointer} .cat.on{background:#fff;color:#000;border-color:#fff}
.grid{max-width:1200px;margin:0 auto;padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.item{background:#1e1e1e;border:1px solid #262626;border-radius:24px;overflow:hidden;display:flex;flex-direction:column;position:relative} .item.destacado::before{content:'DESTACADO';position:absolute;top:12px;left:12px;background:#FFD60A;color:#000;padding:5px 10px;border-radius:100px;font-size:10px;font-weight:900;z-index:2}
.item img{width:100%;height:190px;object-fit:cover} .info{padding:16px;flex:1;display:flex;flex-direction:column} .name{font-weight:900;font-size:16px} .desc{font-size:12px;color:#888;margin-top:6px;flex:1} .priceRow{display:flex;justify-content:space-between;align-items:center;margin-top:12px} .price{font-weight:900;font-size:20px} .price span{color:#FFD60A} .add{background:#fff;color:#000;border:0;padding:12px 18px;border-radius:12px;font-weight:900;cursor:pointer}
.cart{position:fixed;left:12px;right:12px;bottom:12px;background:rgba(20,20,20,.97);border:1px solid #2a2a2a;border-radius:22px;padding:14px;z-index:50} .cart-inner{max-width:1200px;margin:0 auto;display:flex;gap:12px;align-items:flex-start} .cart-list{flex:1;font-size:12px;color:#aaa;max-height:110px;overflow:auto} .cart-item{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #222} .cart-actions button{background:#262626;color:#fff;border:0;width:26px;height:26px;border-radius:6px;cursor:pointer;margin-left:4px} .cart-actions button.del{background:#ff0033} .cart-total{font-weight:900;font-size:18px;text-align:right} .send{background:#FFD60A;color:#000;border:0;padding:14px 22px;border-radius:100px;font-weight:900;cursor:pointer;width:100%;margin-top:8px}
.form{max-width:1200px;margin:0 auto;padding:0 16px 20px} .formGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px} @media(max-width:700px){.formGrid{grid-template-columns:1fr}} .input{background:#0f0f0f;border:1px solid #333;border-radius:12px;padding:14px;color:#fff;width:100%} .label{font-size:11px;color:#FFD60A;font-weight:800;margin-bottom:6px;display:block;text-transform:uppercase}
</style>
</head><body>
<div class="hero" id="hero"></div>
<div id="topinfo"></div>
<div class="intro-wrap" id="introWrap"></div>
<div class="cats" id="cats"></div>
<div class="grid" id="grid"></div>
<div class="form"><div class="card" style="background:#111"><b>Tus datos</b><div id="formFields"></div></div></div>
<div style="height:160px"></div>
<div class="cart"><div class="cart-inner"><div class="cart-list" id="cartList"></div><div style="min-width:160px"><div class="cart-total" id="total"></div><button class="send" id="btnPedir">Pedir por WhatsApp</button></div></div></div>

<script>
const CONFIG_DEFAULT = {"activo": true, "direccion": "San Pedro 4623", "envio": {"costoFijo": 1500, "mensaje": "Envío $1500", "retiro": "Retiro por Caba", "tipo": "fijo"}, "estado": "activo", "horarios": "Elaboración artesanal", "introduccion": {"bajada": "Paciencia, dedicación y pasión. Así hacemos cada producto.", "titulo": "Donde todo comienza"}, "nombre": "ORIGEN 81", "secciones": [{"emoji": "🍺", "id": "cerveza", "titulo": "ORIGEN 81", "texto": "Todo empieza con buena malta, agua, lúpulo y levadura. Y, sobre todo, con tiempo.

Molemos la malta, la maceramos para extraer sus azúcares y obtenemos el mosto. Después llega el lúpulo, el hervor y la fermentación, donde la magia empieza a suceder.

La dejamos madurar lentamente en frío para que los sabores se integren y alcancen su equilibrio.

Finalmente, la embotellamos sin filtrar y sin pasteurizar, conservando todo su carácter artesanal.

Una cerveza viva, hecha con paciencia y pasión."}, {"emoji": "🍖", "id": "fiambres", "titulo": "FABRICACIÓN DE FIAMBRES", "texto": "Todo comienza con una excelente pieza de carne, ingredientes cuidadosamente seleccionados y el tiempo necesario para hacer las cosas bien. Porque la calidad no se apura: se construye con paciencia, dedicación y pasión.

Elegimos una bondiola de primera calidad, la preparamos y condimentamos artesanalmente para realzar su sabor natural. Luego inicia el proceso de curado, donde la sal y las especias penetran lentamente en la carne, desarrollando aromas intensos, una textura delicada y un sabor profundo e irresistible.

Después, la dejamos madurar en condiciones controladas, respetando cada etapa para que los sabores se integren y alcance su punto justo. El resultado es una bondiola tierna, sabrosa y equilibrada, con todo el carácter de una elaboración artesanal.

Finalmente, la cortamos y envasamos cuidadosamente para conservar su frescura, aroma y calidad hasta el momento de disfrutarla.

Una bondiola premium, elaborada artesanalmente con dedicación, tiempo y pasión."}, {"emoji": "🫙", "id": "conservas", "titulo": "ELABORACIÓN DE CONSERVAS", "texto": "Todo comienza con ingredientes frescos, seleccionados cuidadosamente y el tiempo necesario para hacer las cosas bien. Porque la calidad no se apura: se construye con paciencia, dedicación y pasión.

Elegimos frutas y vegetales de primera calidad, los preparamos y combinamos artesanalmente para realzar sus sabores naturales. Luego inicia el proceso de elaboración, donde cada ingrediente se cocina lentamente con especias y condimentos cuidadosamente seleccionados, desarrollando aromas intensos, texturas delicadas y un sabor profundo e irresistible.

Después, envasamos cada conserva respetando rigurosos procesos de higiene y seguridad, para preservar sus propiedades, frescura y calidad. El resultado es una conserva sabrosa, equilibrada y llena de carácter, elaborada con ingredientes nobles y el cuidado de siempre.

Finalmente, sellamos y etiquetamos cada frasco cuidadosamente para conservar todo su sabor y calidad hasta el momento de disfrutarlo.

Conservas premium, elaboradas artesanalmente con dedicación, tiempo y pasión."}], "subtitulo": "Donde todo comienza", "telefono": "", "whatsapp": "5491134890644", "logo": "logo-origen81.jpg", "portada": "logo-origen81.jpg"};
const DATA_DEFAULT = [{"id": 1, "categoria": "Cervezas", "nombre": "Cerveza ORIGEN 81 - Rubia", "descripcion": "Sin filtrar, sin pasteurizar. Viva, artesanal.", "precio": 2800, "img": "https://images.unsplash.com/photo-1608270586620-248524c67de9?w=600", "destacado": true}, {"id": 2, "categoria": "Cervezas", "nombre": "Cerveza ORIGEN 81 - IPA", "descripcion": "Lúpulo intenso, equilibrio perfecto", "precio": 3200, "img": "https://images.unsplash.com/photo-1535958636474-b021ee887b13?w=600"}, {"id": 3, "categoria": "Fiambres", "nombre": "Bondiola Premium Curada", "descripcion": "Curada artesanal, especias naturales, maduración controlada", "precio": 8500, "img": "https://raw.githubusercontent.com/Cartaspro/cartas/main/img/origen-81/origen-81-3-1790116965106.jpg", "destacado": true}, {"id": 4, "categoria": "Fiambres", "nombre": "Picada ORIGEN 81 p/2", "descripcion": "Bondiola, jamón, queso, conservas de la casa", "precio": 18900, "img": "https://raw.githubusercontent.com/Cartaspro/cartas/main/img/origen-81/origen-81-4-1790124571181.jpg"}, {"id": 5, "categoria": "Conservas", "nombre": "Conserva de Berenjenas", "descripcion": "Frasco 360cc, receta artesanal", "precio": 4500, "img": "https://raw.githubusercontent.com/Cartaspro/cartas/main/img/origen-81/origen-81-5-1790116985595.jpg"}, {"id": 6, "categoria": "Conservas", "nombre": "Tomates Confitados", "descripcion": "Frasco 360cc, aceite de oliva y especias", "precio": 5200, "img": "https://images.unsplash.com/photo-1597362925123-77861d3fbac7?w=600"}];

let CONFIG = CONFIG_DEFAULT;
let DATA = DATA_DEFAULT;
let modo = 'retiro';
let catActiva = 'Todos';
let CARRITO = [];
let clientData = {nombre:'', telefono:'', direccion:''};

async function init(){
  try{
    const slug = location.pathname.split('/').filter(Boolean).pop() || 'origen-81';
    const base='https://raw.githubusercontent.com/Cartaspro/cartas/main/';
    const [c,d]=await Promise.all([
      fetch(base+'config/'+slug+'.json?v='+Date.now()).then(r=>r.ok?r.json():null).catch(()=>null),
      fetch(base+'data/'+slug+'.json?v='+Date.now()).then(r=>r.ok?r.json():null).catch(()=>null)
    ]);
    if(c) CONFIG=c;
    if(d) DATA=d;
  }catch(e){ console.log('offline',e); }
  renderHero(); renderTopInfo(); renderIntro(); renderCats(); renderGrid(); renderForm(); upd();
  document.getElementById('btnPedir').addEventListener('click', pedir);
}
function renderHero(){
  const h=document.getElementById('hero');
  const logo = CONFIG.logo || 'logo-origen81.jpg';
  h.innerHTML='<img class="logo" src="'+logo+'"><div class="hero-overlay"></div><div class="hero-content"><h1>ORIGEN <span>81</span></h1><p>'+(CONFIG.direccion||'')+' - '+(CONFIG.subtitulo||'')+'</p></div>';
}
function renderTopInfo(){
  const el=document.getElementById('topinfo');
  const modoRetiro = modo==='retiro';
  el.innerHTML='<div class="card"><b>📍 '+CONFIG.nombre+'</b><div class="small">'+CONFIG.direccion+'<br>'+CONFIG.horarios+'<br>'+(CONFIG.envio?.mensaje||'')+'</div><div style="display:flex;gap:8px;margin-top:12px"><div style="flex:1;padding:10px;border-radius:10px;text-align:center;font-weight:800;font-size:12px;cursor:pointer;background:'+(modoRetiro?'#FFD60A;color:#000':'#0f0f0f;color:#777')+';border:1px solid #333" id="tabRetiro">Retiro</div><div style="flex:1;padding:10px;border-radius:10px;text-align:center;font-weight:800;font-size:12px;cursor:pointer;background:'+(!modoRetiro?'#FFD60A;color:#000':'#0f0f0f;color:#777')+';border:1px solid #333" id="tabEnvio">Envío</div></div></div><div class="card"><b>🕒 '+CONFIG.nombre+'</b><div class="small">'+CONFIG.horarios+'<br><br>'+(CONFIG.envio?.retiro||'')+'<br>'+(CONFIG.envio?.mensaje||'')+'</div></div>';
  document.getElementById('tabRetiro').addEventListener('click', function(){modo='retiro'; renderTopInfo(); renderForm(); upd();});
  document.getElementById('tabEnvio').addEventListener('click', function(){modo='envio'; renderTopInfo(); renderForm(); upd();});
}
function renderIntro(){
  const wrap=document.getElementById('introWrap'); if(!CONFIG.secciones) return;
  let html='<div class="intro-head"><h2>Nuestra <span>Historia</span></h2><p>Paciencia, dedicación y pasión</p></div><div class="intro-grid">';
  CONFIG.secciones.forEach(function(s){ html+='<div class="intro-card"><span class="intro-emoji">'+s.emoji+'</span><div class="intro-title">'+s.titulo+'</div><div class="intro-text">'+s.texto+'</div><div class="intro-footer"><b>ORIGEN 81</b><b style="color:#666">Donde todo comienza</b></div></div>'; });
  html+='</div>'; wrap.innerHTML=html;
}
function renderCats(){
  const cats=[...new Set(DATA.map(function(d){return d.categoria}))]; const cont=document.getElementById('cats'); cont.innerHTML='';
  ['Todos'].concat(cats).forEach(function(c){ const el=document.createElement('div'); el.className='cat'+(c===catActiva?' on':''); el.textContent=c; el.addEventListener('click', function(){catActiva=c; renderCats(); renderGrid();}); cont.appendChild(el); });
}
function renderGrid(){
  const grid=document.getElementById('grid'); const filtrados = catActiva==='Todos' ? DATA : DATA.filter(function(d){return d.categoria===catActiva}); grid.innerHTML='';
  filtrados.forEach(function(p){ const div=document.createElement('div'); div.className='item'+(p.destacado?' destacado':''); div.innerHTML='<img src="'+p.img+'" onerror="this.style.display='none'"><div class="info"><div class="name">'+p.nombre+'</div><div class="desc">'+(p.descripcion||'')+'</div><div class="priceRow"><div class="price">$<span>'+Number(p.precio).toLocaleString('es-AR')+'</span></div><button class="add" data-id="'+p.id+'">+ Agregar</button></div></div>'; grid.appendChild(div); });
  grid.querySelectorAll('.add').forEach(function(btn){ btn.addEventListener('click', function(){ add(Number(btn.dataset.id)); }); });
}
function renderForm(){
  const ff=document.getElementById('formFields'); if(!ff) return;
  const prevN=document.getElementById('f_nombre')?.value||clientData.nombre; const prevT=document.getElementById('f_tel')?.value||clientData.telefono; const prevD=document.getElementById('f_dir')?.value||clientData.direccion;
  clientData.nombre=prevN; clientData.telefono=prevT; clientData.direccion=prevD;
  if(modo==='retiro'){ ff.innerHTML='<div class="formGrid"><div><span class="label">Nombre *</span><input id="f_nombre" class="input" placeholder="Tu nombre" value="'+clientData.nombre+'"></div><div><span class="label">Telefono *</span><input id="f_tel" class="input" placeholder="11 1234-5678" value="'+clientData.telefono+'"></div></div><div class="small" style="margin-top:10px">Retiro en '+CONFIG.direccion+'</div>'; }
  else { ff.innerHTML='<div class="formGrid"><div><span class="label">Nombre *</span><input id="f_nombre" class="input" placeholder="Tu nombre" value="'+clientData.nombre+'"></div><div><span class="label">Telefono *</span><input id="f_tel" class="input" placeholder="11 1234-5678" value="'+clientData.telefono+'"></div><div style="grid-column:1/-1"><span class="label">Direccion *</span><input id="f_dir" class="input" placeholder="San Pedro 4623, CABA" value="'+clientData.direccion+'"></div></div>'; }
  const n=document.getElementById('f_nombre'); if(n){ n.addEventListener('input', function(e){clientData.nombre=e.target.value;}); }
  const t=document.getElementById('f_tel'); if(t){ t.addEventListener('input', function(e){clientData.telefono=e.target.value;}); }
  const d=document.getElementById('f_dir'); if(d){ d.addEventListener('input', function(e){clientData.direccion=e.target.value;}); }
}
function add(id){ const pr=DATA.find(function(x){return x.id===id}); const ex=CARRITO.find(function(x){return x.id===id}); if(ex) ex.cant++; else { const copy=Object.assign({},pr); copy.cant=1; CARRITO.push(copy); } upd(); }
function removeOne(id){ const ex=CARRITO.find(function(x){return x.id===id}); if(!ex) return; ex.cant--; if(ex.cant<=0) CARRITO=CARRITO.filter(function(x){return x.id!==id}); upd(); }
function del(id){ CARRITO=CARRITO.filter(function(x){return x.id!==id}); upd(); }
window.removeOne=removeOne; window.del=del;
function getEnvioCosto(){ return modo==='retiro'?0:Number(CONFIG.envio?.costoFijo||0); }
function upd(){
  const list=document.getElementById('cartList'); const tot=document.getElementById('total'); if(!list) return;
  if(!CARRITO.length){ list.innerHTML='<span style="color:#555">Carrito vacio</span>'; tot.innerHTML=''; return; }
  let t=0; let html=''; CARRITO.forEach(function(c){ t+=c.precio*c.cant; html+='<div class="cart-item"><div><b>'+c.cant+'x '+c.nombre+'</b></div><div class="cart-actions"><button onclick="removeOne('+c.id+')">-</button><button onclick="add('+c.id+')">+</button><button class="del" onclick="del('+c.id+')">x</button></div></div>'; });
  list.innerHTML=html; const env=getEnvioCosto(); const total=t+env; tot.innerHTML='Subtotal $'+t.toLocaleString('es-AR')+'<br>'+(modo==='retiro'?'Retiro gratis':env===0?'Envio gratis':'Envio $'+env)+'<br><b>Total $'+total.toLocaleString('es-AR')+'</b>';
}
function pedir(){
  const nombre=(document.getElementById('f_nombre')?.value||'').trim(); const tel=(document.getElementById('f_tel')?.value||'').trim(); const dir=(document.getElementById('f_dir')?.value||'').trim();
  let faltan=[]; if(!nombre) faltan.push('Nombre'); if(!tel) faltan.push('Telefono'); if(modo==='envio' && !dir) faltan.push('Direccion'); if(!CARRITO.length) faltan.push('Productos');
  if(faltan.length){ alert('Faltan: '+faltan.join(', ')); return; }
  let msg=[]; msg.push('Nuevo pedido - '+CONFIG.nombre); msg.push(''); msg.push('Cliente: '+nombre); msg.push('Tel: '+tel);
  if(modo==='envio'){ msg.push('Direccion: '+dir); } else { msg.push('Retiro en local: '+CONFIG.direccion); }
  msg.push(''); msg.push('Pedido:'); CARRITO.forEach(function(c){ msg.push('- '+c.cant+'x '+c.nombre+' $'+(c.precio*c.cant)); });
  msg.push(''); const env=getEnvioCosto(); msg.push('Modo: '+(modo==='retiro'?'Retiro gratis':(env===0?'Envio gratis':'Envio $'+env))); const total=CARRITO.reduce(function(s,c){return s+c.precio*c.cant},0)+env; msg.push('TOTAL: $'+total.toLocaleString('es-AR'));
  const texto=msg.join('\n'); const url='https://wa.me/'+CONFIG.whatsapp+'?text='+encodeURIComponent(texto); window.open(url,'_blank');
}
init();
</script>
</body></html>
